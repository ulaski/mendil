version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docker
    schedule:
      interval: weekly
  # teamspeak-js (native engine) is pre-1.0 and moves fast; CI's end-to-end test checks each bump.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
