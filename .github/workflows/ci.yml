name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check shell scripts
        run: shellcheck docker/entrypoint.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Build Classic image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=classic
          cache-to: type=gha,mode=max,scope=classic
      - name: Build Native image (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: native
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=native
          cache-to: type=gha,mode=max,scope=native
