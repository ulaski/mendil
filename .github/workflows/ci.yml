name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check shell scripts
        run: shellcheck docker/entrypoint.sh

  e2e:
    name: e2e (native engine, ${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [ts3, ts6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/yt-dlp && /tmp/yt-dlp/bin/pip install --quiet -r docker/requirements.txt
          echo /tmp/yt-dlp/bin >> "$GITHUB_PATH"
      - name: Start a TeamSpeak server
        run: |
          if [ "${{ matrix.server }}" = ts3 ]; then
            docker run -d --name ts -e TS3SERVER_LICENSE=accept -p 9987:9987/udp teamspeak:latest
          else
            docker run -d --name ts -e TSSERVER_LICENSE_ACCEPTED=accept -p 9987:9987/udp teamspeaksystems/teamspeak6-server:latest
          fi
          for _ in $(seq 60); do docker logs ts 2>&1 | grep -q 'listening on 0.0.0.0:9987' && break; sleep 2; done
          docker logs ts 2>&1 | grep -E 'TeamSpeak .*Server [0-9]' | head -1
      - name: Run the end-to-end test
        run: node test/e2e/native-e2e.mjs
        env:
          TS_HOST: 127.0.0.1
          TS_PORT: 9987

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Build Classic image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=classic
          cache-to: type=gha,mode=max,scope=classic
      - name: Build Native image (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: native
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=native
          cache-to: type=gha,mode=max,scope=native
