services:
  mendil:
    image: ghcr.io/ulaski/mendil:latest
    build: .
    platform: linux/amd64 # the official TS3 client is x86_64 only
    container_name: mendil
    restart: unless-stopped
    stop_grace_period: 20s # the bot disconnects cleanly before the TS client is stopped
    env_file: .env
    shm_size: 256m # Qt/Chromium inside the TS3 client uses /dev/shm
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Web panel (README "Web panel"). Keep 127.0.0.1 unless it's behind a reverse proxy with HTTPS.
    # ports:
    #   - "127.0.0.1:8080:8080"
    volumes:
      - ts3client-data:/home/node/.ts3client # identity + settings
      - ts3client-bin:/opt/ts3client # downloaded TeamSpeak client
      # Optional YouTube cookies (docs/youtube.md), then set YTDLP_COOKIES_FILE=/cookies/cookies.txt.
      # Must be writable by uid 1000: yt-dlp saves refreshed cookies back to the file.
      # - ./cookies:/cookies

volumes:
  ts3client-data:
  ts3client-bin:
